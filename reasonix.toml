[permissions]
allow = ["Bash=cd demo && for f in assets/js/*.js assets/js/pages/*.js; do node --check \"$f\" || echo \"SYNTAX FAIL: $f\"; done && echo \"=== ALL JS SYNTAX OK ===\"", "Bash=cd demo && node -e \"\nconst http=require('http'),fs=require('fs'),path=require('path');\nconst MIME={'.html':'text/html','.css':'text/css','.js':'application/javascript'};\nconst srv=http.createServer((req,res)=>{\n  let p=decodeURIComponent(req.url.split('?')[0]);\n  if(p==='/')p='/index.html';\n  const f=path.join(__dirname,p);\n  if(!fs.existsSync(f)||fs.statSync(f).isDirectory()){res.writeHead(404);res.end('404');return;}\n  res.writeHead(200,{'Content-Type':MIME[path.extname(f)]||'application/octet-stream'});\n  fs.createReadStream(f).pipe(res);\n});\nsrv.listen(8931,()=>{\n  const pages=['index.html','onboarding.html','records.html','quick-record.html','ai-confirm.html','cats.html','cat-detail.html','trends.html','medical-upload.html','reminders.html','moments.html','family.html','inventory.html','expenses.html'];\n  let left=pages.length, fail=0;\n  pages.forEach(pg=>{\n    http.get('http://127.0.0.1:8931/'+pg,res=>{\n      let n=0;res.on('data',c=>n+=c.length);res.on('end',()=>{\n        if(res.statusCode!==200||n<500){fail++;console.log('FAIL',pg,res.statusCode,n);}\n        else console.log('OK',pg,n+'B');\n        if(--left===0){srv.close();process.exit(fail?1:0);}\n      });\n    }).on('error',e=>{fail++;console.log('ERR',pg,e.message);if(--left===0){srv.close();process.exit(1);}});\n  });\n});\n\"", "Bash=cd demo && node -e \"\n// Mock 数据完整性验证（node 环境模拟 window）\nglobal.window = global;\nrequire('./assets/js/mock.js');\nrequire('./assets/js/icons.js');\nconst M = window.Mock, I = window.AppIcons;\nlet fail = 0;\nconst check = (cond, msg) => { if(!cond){ fail++; console.log('FAIL:', msg); } };\n\ncheck(M.cats.length === 2, '两只猫');\ncheck(M.cats[0].name === '小白' && M.cats[1].name === '小橘', '猫名正确');\ncheck(M.trends['cat-whit'].length === 30 && M.trends['cat-oran'].length === 30, '30 天趋势数据');\ncheck(M.trends['cat-whit'][0].date === M.utils.todayStr(), '趋势第 1 天是今天');\ncheck(M.todayStatus['cat-whit'].vomitState === 'danger', '小白今日呕吐危险状态');\ncheck(M.todayStatus['cat-oran'].medicationState === 'warn', '小橘今晚用药提醒');\ncheck(M.focusItems.length === 2, '2 条关注项');\ncheck(M.aiSummary.evidence.length >= 5, 'AI 摘要含依据');\ncheck(M.aiSummary.body.includes('不构成') === false, 'AI 摘要正文（免责声明单独展示）');\ncheck(M.reminders.filter(r=>r.state==='todo').length >= 5, '待处理提醒');\ncheck(M.moments.length === 2, '两个月时间线');\ncheck(M.inventory.some(i=>i.status==='low') && M.inventory.some(i=>i.status==='expiring'), '低库存+即将过期');\ncheck(M.aiParseSession.records.length === 4, 'AI 解析 4 条记录');\ncheck(M.aiParseSession.records.some(r=>r.fields.some(f=>f.confidence==='low')), '有待确认字段');\ncheck(M.recordTypes.high.length === 6 && M.recordTypes.health.length === 6 && M.recordTypes.life.length >= 4, '记录类型分组');\ncheck(typeof I.icon('food',20)==='string' && I.icon('food',20).includes('<svg'), '图标渲染');\ncheck(typeof I.catAvatar(M.cats[0],72)==='string', '猫头像渲染');\n// 今日状态字段完整性\n['food','water','elimination','vomit','medication','mental'].forEach(k=>{\n  check(M.todayStatus['cat-whit'][k+ 'State'] !== undefined, '状态字段 '+k);\n});\n// 图标名覆盖检查：mock 中引用到的图标都存在\nconst used = JSON.stringify(M).match(/icon:\\s*\\\"([a-zA-Z-]+)\\\"/g)||[];\nconsole.log('--- 完成: ' + (fail===0 ? '全部通过' : fail+' 项失败'));\nprocess.exit(fail?1:0);\n\"", "Bash=cd demo && node -e \"\nglobal.window = global;\nrequire('./assets/js/mock.js');\nrequire('./assets/js/icons.js');\nconst M = window.Mock, I = window.AppIcons;\nlet fail = 0;\nconst check = (cond, msg) => { if(!cond){ fail++; console.log('FAIL:', msg); } };\n\ncheck(M.cats.length === 2, '两只猫');\ncheck(M.cats[0].name === '小白' && M.cats[1].name === '小橘', '猫名正确');\ncheck(M.trends['cat-whit'].length === 30 && M.trends['cat-oran'].length === 30, '30 天趋势数据');\ncheck(M.trends['cat-whit'][29].date === M.utils.todayStr(), '趋势最后一天是今天');\ncheck(M.trends['cat-whit'][0].date === M.utils.dateStr(29), '趋势第一天是 29 天前');\ncheck(M.todayStatus['cat-whit'].vomitState === 'danger', '小白今日呕吐危险状态');\ncheck(M.todayStatus['cat-oran'].medicationState === 'warn', '小橘今晚用药提醒');\ncheck(M.focusItems.length === 2, '2 条关注项');\ncheck(M.aiSummary.evidence.length >= 5, 'AI 摘要含依据');\ncheck(M.reminders.filter(r=>r.state==='todo').length >= 5, '待处理提醒');\ncheck(M.moments.length === 2, '两个月时间线');\ncheck(M.inventory.some(i=>i.status==='low') && M.inventory.some(i=>i.status==='expiring'), '低库存+即将过期');\ncheck(M.aiParseSession.records.length === 4, 'AI 解析 4 条记录');\ncheck(M.aiParseSession.records.some(r=>r.fields.some(f=>f.confidence==='low')), '有待确认字段');\ncheck(M.recordTypes.high.length === 6 && M.recordTypes.health.length === 6 && M.recordTypes.life.length >= 4, '记录类型分组');\ncheck(typeof I.icon('food',20)==='string' && I.icon('food',20).includes('<svg'), '图标渲染');\ncheck(typeof I.catAvatar(M.cats[0],72)==='string', '猫头像渲染');\n['food','water','elimination','vomit','medication','mental'].forEach(k=>{\n  check(M.todayStatus['cat-whit'][k+ 'State'] !== undefined, '状态字段 '+k);\n});\n// mock.js 中使用的图标名都存在\nconst usedIcons = new Set();\nJSON.stringify(M).replace(/icon:\\s*\\\"([a-zA-Z-]+)\\\"/g, (m,n)=>usedIcons.add(n));\nusedIcons.forEach(n=>{ if(!I.list[n]) { fail++; console.log('FAIL: mock 引用不存在的图标', n); } });\nconsole.log('--- 完成: ' + (fail===0 ? '全部通过' : fail+' 项失败'));\nprocess.exit(fail?1:0);\n\"", "Bash=cd demo && echo \"=== 1. JS 语法 ===\" && for f in assets/js/*.js assets/js/pages/*.js; do node --check \"$f\" || echo \"FAIL: $f\"; done && echo \"全部通过\" && echo \"=== 2. 链接检查 ===\" && node tools/check_links.js && echo \"=== 3. 服务器冒烟 ===\" && node -e \"\nconst http=require('http'),fs=require('fs'),path=require('path');\nconst MIME={'.html':'text/html','.css':'text/css','.js':'application/javascript'};\nconst srv=http.createServer((req,res)=>{\n  let p=decodeURIComponent(req.url.split('?')[0]); if(p==='/')p='/index.html';\n  const f=path.join(__dirname,p);\n  if(!fs.existsSync(f)){res.writeHead(404);res.end();return;}\n  res.writeHead(200,{'Content-Type':MIME[path.extname(f)]||'text/plain'});\n  fs.createReadStream(f).pipe(res);\n});\nsrv.listen(8932,()=>{\n  const pages=['index.html','onboarding.html','records.html','quick-record.html','ai-confirm.html','cats.html','cat-detail.html','trends.html','medical-upload.html','reminders.html','moments.html','family.html','inventory.html','expenses.html','assets/js/app.js','assets/js/pages/trends.js','assets/css/pages.css'];\n  let left=pages.length,fail=0;\n  pages.forEach(pg=>http.get('http://127.0.0.1:8932/'+pg,res=>{\n    let n=0;res.on('data',c=>n+=c.length);res.on('end',()=>{\n      if(res.statusCode!==200||n<100){fail++;console.log('FAIL',pg,res.statusCode);}\n      if(--left===0){srv.close();console.log(fail?('失败 '+fail):'全部 17 项 200 OK');process.exit(fail?1:0);}\n    });\n  }).on('error',()=>{fail++;if(--left===0){srv.close();process.exit(1);}}));\n});\n\"", "Bash=cd demo && node tools/check_links.js && echo \"=== 服务器冒烟 ===\" && node -e \"\nconst http=require('http'),fs=require('fs'),path=require('path');\nconst MIME={'.html':'text/html','.css':'text/css','.js':'application/javascript'};\nconst srv=http.createServer((req,res)=>{\n  let p=decodeURIComponent(req.url.split('?')[0]); if(p==='/')p='/index.html';\n  const f=path.join(__dirname,p);\n  if(!fs.existsSync(f)){res.writeHead(404);res.end();return;}\n  res.writeHead(200,{'Content-Type':MIME[path.extname(f)]||'text/plain'});\n  fs.createReadStream(f).pipe(res);\n});\nsrv.listen(8932,()=>{\n  const pages=['index.html','onboarding.html','records.html','quick-record.html','ai-confirm.html','cats.html','cat-detail.html','trends.html','medical-upload.html','reminders.html','moments.html','family.html','inventory.html','expenses.html','assets/js/app.js','assets/js/pages/trends.js','assets/css/pages.css'];\n  let left=pages.length,fail=0;\n  pages.forEach(pg=>http.get('http://127.0.0.1:8932/'+pg,res=>{\n    let n=0;res.on('data',c=>n+=c.length);res.on('end',()=>{\n      if(res.statusCode!==200||n<100){fail++;console.log('FAIL',pg,res.statusCode);}\n      if(--left===0){srv.close();console.log(fail?('失败 '+fail):'全部 17 项 200 OK');process.exit(fail?1:0);}\n    });\n  }).on('error',()=>{fail++;if(--left===0){srv.close();process.exit(1);}}));\n});\n\""]
