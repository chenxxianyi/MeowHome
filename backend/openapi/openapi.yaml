openapi: 3.0.0
info:
  title: MeowHome API
  version: 0.2.0
  description: |
    猫宅 MeowHome 后端 API。移动优先的家庭多猫照护、记录、健康聚合与 AI 辅助。
    所有业务资源均通过 FamilyScope 授权，时间字段统一返回 RFC 3339（UTC 存储）。
servers:
  - url: /api/v1
    description: 默认前缀
tags:
  - name: system
    description: 系统与健康检查
  - name: auth
    description: 认证与会话
  - name: families
    description: 家庭与成员
  - name: cats
    description: 猫咪档案
  - name: vaccines
    description: 疫苗记录建议与日期待办
  - name: agent
    description: 猫管家 Agent（主动巡检 + 智能问答）
paths:
  /health/live:
    get:
      tags: [system]
      summary: 存活检查
      operationId: healthLiveness
      security: []
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/ready:
    get:
      tags: [system]
      summary: 就绪检查
      operationId: healthReadiness
      security: []
      responses:
        '200':
          description: 服务就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /ping:
    get:
      tags: [system]
      summary: 联通性检查
      operationId: ping
      security: []
      responses:
        '200':
          description: pong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  # --- B3 阶段补充：auth / families / cats ---
  /auth/register:
    post:
      tags: [auth]
      summary: 注册
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [auth]
      summary: 登录
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新令牌
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [auth]
      summary: 登出
      operationId: authLogout
      responses:
        '204':
          description: 登出成功
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags: [auth]
      summary: 当前用户
      operationId: authMe
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /families:
    post:
      tags: [families]
      summary: 创建家庭
      operationId: createFamily
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /families/{familyId}:
    get:
      tags: [families]
      summary: 获取家庭
      operationId: getFamily
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: 家庭详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [families]
      summary: 更新家庭
      operationId: updateFamily
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
  /families/{familyId}/members:
    get:
      tags: [families]
      summary: 成员列表
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListEnvelope'
  /families/{familyId}/cats:
    get:
      tags: [cats]
      summary: 猫咪列表
      operationId: listCats
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: 猫咪列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatListEnvelope'
    post:
      tags: [cats]
      summary: 创建猫咪
      operationId: createCat
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatEnvelope'
  /families/{familyId}/cats/{catId}/avatar:
    post:
      tags: [cats]
      summary: 上传猫咪头像
      operationId: uploadCatAvatar
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/CatId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 头像上传并更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatEnvelope'
  /families/{familyId}/cats/{catId}:
    get:
      tags: [cats]
      summary: 获取猫咪
      operationId: getCat
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/CatId'
      responses:
        '200':
          description: 猫咪详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [cats]
      summary: 更新猫咪
      operationId: updateCat
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/CatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatEnvelope'
    delete:
      tags: [cats]
      summary: 删除猫咪（软删除）
      operationId: deleteCat
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/CatId'
      responses:
        '204':
          description: 删除成功
  /families/{familyId}/records:
    get:
      tags: [records]
      summary: 查询家庭记录
      operationId: listFamilyRecords
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: cat_id
          in: query
          schema: { type: string }
        - name: type
          in: query
          description: 逗号分隔的记录类型
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 按发生时间倒序返回记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Record' }
    post:
      tags: [records]
      summary: 创建日常记录
      operationId: createFamilyRecord
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Record' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /families/{familyId}/records/{recordId}:
    get:
      tags: [records]
      summary: 按编号读取本家庭未删除的原始记录
      operationId: getFamilyRecord
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: recordId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 原始记录详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Record' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [records]
      summary: 更正普通记录（完整替换可编辑字段）
      operationId: updateFamilyRecord
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: recordId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordUpdateRequest' }
      responses:
        '200':
          description: 更正成功；创建者与创建时间保持不变
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Record' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [records]
      summary: 撤销普通记录（软删除）
      operationId: deleteFamilyRecord
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: recordId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: 撤销成功 }
        '400':
          description: 疫苗记录必须通过疫苗专项流程更正
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # --- Agent（猫管家）---
  /families/{familyId}/records/{recordId}/vaccine-suggestion:
    get:
      tags: [vaccines]
      summary: 根据已保存的接种记录生成下一针日期建议
      operationId: suggestNextVaccineDate
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: 建议结果；信息不足时返回 needs_input，未覆盖类型返回 unsupported
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VaccineSuggestion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/records/{recordId}/vaccine-reminders:
    post:
      tags: [vaccines]
      summary: 确认并创建与接种记录关联的疫苗待办
      operationId: createVaccineReminder
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVaccineReminderRequest'
      responses:
        '201':
          description: 创建成功或返回该接种记录已有的待办（幂等）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Reminder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/reminders/{reminderId}/complete-with-record:
    patch:
      tags: [vaccines]
      summary: 关联接种记录并完成疫苗待办
      operationId: completeVaccineReminderWithRecord
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: reminderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [record_id]
              properties:
                record_id: { type: string }
      responses:
        '200':
          description: 待办完成并记录关联
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Reminder'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/reminders/{reminderId}/schedule:
    patch:
      tags: [vaccines]
      summary: 调整疫苗待办的本地计划日期
      operationId: rescheduleVaccineReminder
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: reminderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_date, timezone]
              properties:
                scheduled_date: { type: string, format: date }
                timezone: { type: string, example: Asia/Shanghai }
      responses:
        '200':
          description: 日期已调整
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Reminder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/reminders/{reminderId}:
    delete:
      tags: [vaccines]
      summary: 取消未完成的疫苗待办
      operationId: cancelVaccineReminder
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: reminderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: 待办已取消
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/agent/messages:
    get:
      tags: [agent]
      summary: 家庭 Agent 消息列表（仅 visibility=family，不含私有聊天）
      description: |
        过滤不可识别的 type/status 时返回 400，不默认为全部数据。
        游标 before 为 `generated_at|id`，不允许跨家庭或绕过权限。
        仅返回 family 可见消息。默认 20 条，最多 50 条；next_cursor 始终存在，
        空字符串表示没有下一页。日期窗口按家庭 IANA 时区的本地日历计算，
        UTC 查询区间使用左闭右开边界。
      operationId: listAgentMessages
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: type
          in: query
          schema:
            type: string
            enum: [patrol_abnormal, patrol_weight, chat_answer, reminder_draft]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, dismissed, expired]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: before
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 家庭消息列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /families/{familyId}/agent/messages/{messageId}:
    get:
      tags: [agent]
      summary: Agent 消息详情
      operationId: getAgentMessage
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 消息详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /families/{familyId}/agent/messages/{messageId}/draft:
    patch:
      tags: [agent]
      summary: 创建或编辑该消息的唯一提醒草稿
      description: |
        未创建时 expected_version=0，首次保存后版本为 1；
        旧版本返回 AGENT_CONFLICT（409）。
      operationId: editAgentReminderDraft
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentReminderEditRequest'
      responses:
        '200':
          description: 草稿已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentReminderDraftEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /families/{familyId}/agent/messages/{messageId}/confirm:
    post:
      tags: [agent]
      summary: 确认提醒草稿（幂等）
      description: |
        服务端从消息行内加载草稿，客户端只提交 expected_version；
        再次校验身份、成员资格、可见性、猫咪归属、开关、草稿状态/有效期/计划时间。
        确认时草稿必须有未来的绝对 scheduled_at；只有文字时间的草稿可保存但不可确认。
        重复确认返回同一提醒，不新建。
      operationId: confirmAgentReminderDraft
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfirmRequest'
      responses:
        '200':
          description: 确认成功（幂等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfirmEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /families/{familyId}/agent/messages/{messageId}/dismiss:
    post:
      tags: [agent]
      summary: 忽略 Agent 消息（幂等）
      description: 忽略仅隐藏消息，不撤销已创建的正式提醒。
      operationId: dismissAgentMessage
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: 忽略成功
        '403':
          $ref: '#/components/responses/Forbidden'
  /families/{familyId}/agent/chat:
    post:
      tags: [agent]
      summary: Agent 对话
      description: |
        首轮不携带 session_id 时按 family+user+client_message_id 恢复已创建会话。
        消息去除首尾空白后长度为 1–2000 个 Unicode 字符。每轮最多携带
        5 轮历史、4 次模型请求和 8 次工具执行，整体预算 25 秒。
        模型输出校验失败时返回 AGENT_INVALID_OUTPUT（422）；模型不可用时
        degraded=true，且兜底内容只能依据已成功取得的授权数据。
      operationId: agentChat
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          description: 聊天结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: 模型输出不合法；Envelope.code 为 AGENT_INVALID_OUTPUT
        '503':
          description: Agent 关闭或模型不可用；Envelope.code 为 AGENT_DISABLED 或 AGENT_UNAVAILABLE
  /families/{familyId}/agent/sessions:
    get:
      tags: [agent]
      summary: 当前用户在本家庭的 Agent 会话列表
      operationId: listAgentSessions
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: before
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionListEnvelope'
  /families/{familyId}/agent/sessions/{sessionId}/messages:
    get:
      tags: [agent]
      summary: 本人私有会话消息（游标分页）
      operationId: listAgentSessionMessages
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: before
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 会话消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionMessagesEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
  /internal/agent/patrol:
    post:
      tags: [agent]
      summary: 手动触发指定家庭巡检（仅目标家庭真实 admin，限流与审计）
      operationId: runAgentPatrol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPatrolRequest'
      responses:
        '200':
          description: 巡检执行结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPatrolEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: RATE_LIMITED；每来源 IP 每分钟最多 3 次
  /families/{familyId}/shopping-list:
    get:
      tags: [shopping]
      summary: 查询待购买项
      description: status 为空表示全部；未完成项优先展示，其余按创建时间倒序。
      operationId: listShoppingList
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, purchased, dismissed]
      responses:
        '200':
          description: 待购买项列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShoppingItem'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [shopping]
      summary: 创建待购买项（不改变库存数量）
      operationId: createShoppingItem
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingInput'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /families/{familyId}/shopping-list/{itemId}:
    patch:
      tags: [shopping]
      summary: 修改、完成或驳回待购买项
      description: status 置为 purchased 即完成（completed_at 同时写入），dismissed 为驳回，todo 为恢复。
      operationId: updateShoppingItem
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingUpdateInput'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [shopping]
      summary: 移除待购买项
      operationId: deleteShoppingItem
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: 已移除
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/inventory/{itemId}/adjustments:
    post:
      tags: [inventory]
      summary: 手动调整库存数量（数量与流水同事务）
      description: delta 为正入库、负出库；调整后数量不得为负，否则返回 409 CONFLICT。
      operationId: adjustInventoryItem
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjustRequest'
      responses:
        '201':
          description: 已调整
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAdjustment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CONFLICT；调整后数量将为负数
  /families/{familyId}/inventory/transactions:
    get:
      tags: [inventory]
      summary: 库存流水（可按库存项过滤）
      operationId: listInventoryTransactions
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: item_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: 流水列表（创建时间倒序）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryTransaction'
        '403':
          $ref: '#/components/responses/Forbidden'
  /families/{familyId}/purchase-media:
    post:
      tags: [purchasing]
      summary: 上传单张订单截图，返回私有媒体键
      description: |
        微信小程序 wx.uploadFile 只支持单文件：逐张上传到本接口取得 media_key，
        再以 JSON `{"media_keys": [...]}` 调用 POST /purchase-imports 建单。
        截图仅写入私有媒体存储，不写库存或支出。
      operationId: uploadPurchaseMedia
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                required: [media_key]
                properties:
                  media_key: { type: string }
        '400':
          description: 图片格式/大小不合法（VALIDATION_FAILED 或 UPLOAD_TOO_LARGE）
        '403':
          $ref: '#/components/responses/Forbidden'
  /families/{familyId}/purchase-imports:
    post:
      tags: [purchasing]
      summary: 上传订单截图并创建导入草稿
      description: |
        两种请求体：multipart/form-data（文件字段名 files，单次 1–5 张 JPG/PNG/GIF/WebP）
        或 application/json `{"media_keys": [...]}`（逐张上传 purchase-media 后使用）。
        截图仅写入私有媒体存储，不写库存或支出；需家庭成员身份才能上传与查看。
      operationId: createPurchaseImport
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
          application/json:
            schema:
              type: object
              required: [media_keys]
              properties:
                media_keys:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string }
      responses:
        '201':
          description: 已创建（status=uploaded）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseImport'
        '400':
          description: 截图数量/格式/大小不合法（VALIDATION_FAILED 或 UPLOAD_TOO_LARGE）
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [purchasing]
      summary: 采购导入历史
      operationId: listPurchaseImports
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: 导入列表（创建时间倒序，不含商品行）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseImport'
        '403':
          $ref: '#/components/responses/Forbidden'
  /families/{familyId}/purchase-imports/{importId}:
    get:
      tags: [purchasing]
      summary: 查询识别状态、草稿与商品行
      operationId: getPurchaseImport
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: importId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 导入详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseImport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [purchasing]
      summary: 保存用户修订后的订单草稿
      description: |
        expected_version 与当前 recognition_version 不一致时返回 409 CONFLICT。
        processing/confirmed/cancelled 状态下拒绝编辑。
      operationId: updatePurchaseDraft
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: importId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseDraftRequest'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseImport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CONFLICT；草稿版本冲突或状态不允许编辑
  /families/{familyId}/purchase-imports/{importId}/recognize:
    post:
      tags: [purchasing]
      summary: 启动或重试订单截图识别
      description: |
        uploaded/failed/parsed/partial 可识别或重试；processing 返回 409。
        识别失败（OCR 未配置、超时、输出无法解析）时导入保留为 failed，
        返回 200 与 error_summary，可继续手动填写草稿后确认。
      operationId: recognizePurchaseImport
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: importId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 识别结果（status=parsed/partial/failed）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRecognizeResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CONFLICT；识别进行中或导入已终结
  /families/{familyId}/purchase-imports/{importId}/confirm:
    post:
      tags: [purchasing]
      summary: 幂等确认采购并落账
      description: |
        支出、库存流水、库存数量与待购完成在同一事务内落账；同一导入重复确认
        返回 created=false 且不重复写入。expected_version 提供时做草稿版本校验。
      operationId: confirmPurchaseImport
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: importId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseConfirmRequest'
      responses:
        '200':
          description: 落账摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseConfirmSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: NOT_FOUND；导入或关联资源不属于当前家庭
        '409':
          description: CONFLICT；识别中、已取消或草稿版本冲突
  /families/{familyId}/purchase-imports/{importId}/cancel:
    post:
      tags: [purchasing]
      summary: 取消未确认的导入草稿
      description: 已确认的采购不可取消（应通过冲正流程更正）；重复取消返回 cancelled。
      operationId: cancelPurchaseImport
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: importId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseImport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CONFLICT；已确认或识别进行中
  /families/{familyId}/purchase-imports/{importId}/media/{index}:
    get:
      tags: [purchasing]
      summary: 读取原始订单截图（家庭成员限定）
      operationId: getPurchaseImportMedia
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: importId
          in: path
          required: true
          schema: { type: string }
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 图片二进制
          content:
            image/png:
              schema: { type: string, format: binary }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [purchasing]
      summary: 删除一张原始截图（隐私：允许用户立即删除原图）
      description: 删除后返回更新后的导入记录；媒体引用同步移除。
      operationId: deletePurchaseImportMedia
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: importId
          in: path
          required: true
          schema: { type: string }
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 已删除并返回导入记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseImport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    FamilyId:
      name: familyId
      in: path
      required: true
      schema:
        type: string
        example: '01J'
    CatId:
      name: catId
      in: path
      required: true
      schema:
        type: string
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未认证或令牌失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 无权访问该家庭资源
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 资源冲突（如邮箱已注册）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up]
        version:
          type: string
    Envelope:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
        data:
          description: 业务数据
        request_id:
          type: string
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
        request_id:
          type: string
    VaccineSuggestion:
      type: object
      required: [status, cat_id, prior_doses_recorded, reason, timezone]
      properties:
        status:
          type: string
          enum: [suggested, needs_input, unsupported]
        cat_id: { type: string }
        vaccine_code: { type: string }
        vaccine_name: { type: string }
        dose_number: { type: string }
        age_weeks: { type: integer }
        prior_doses_recorded: { type: integer }
        date_window_start: { type: string, format: date }
        date_window_end: { type: string, format: date }
        default_reminder_date: { type: string, format: date }
        title: { type: string }
        reason: { type: string }
        rule_id: { type: string }
        rule_version: { type: string }
        source_url: { type: string, format: uri }
        timezone: { type: string }
        date_source: { type: string }
    CreateVaccineReminderRequest:
      type: object
      required: [scheduled_date, date_source, timezone]
      properties:
        scheduled_date: { type: string, format: date }
        date_source:
          type: string
          enum: [rule_suggestion, user, veterinarian, product_label]
        timezone: { type: string, example: Asia/Shanghai }
    Reminder:
      type: object
      required: [id, catId, type, title, subtitle, time, state, icon]
      properties:
        id: { type: string }
        catId: { type: string }
        type: { type: string }
        title: { type: string }
        subtitle: { type: string }
        time: { type: string }
        state: { type: string, enum: [todo, done] }
        icon: { type: string }
        rule: { type: string }
        scheduled_at: { type: string, format: date-time }
        timezone: { type: string }
        completed_at: { type: string, format: date-time }
        source_record_id: { type: string }
        completed_record_id: { type: string }
        metadata:
          type: object
          additionalProperties: true
    RegisterRequest:
      type: object
      required: [email, password, user_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        user_name:
          type: string
          minLength: 1
          maxLength: 64
        family_name:
          type: string
          description: 首次注册时创建的家庭名称
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    AuthResult:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: 访问令牌有效期（秒）
        user:
          $ref: '#/components/schemas/User'
    AuthEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthResult'
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        user_name:
          type: string
        family_id:
          type: string
        member_id:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        timezone:
          type: string
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'
    Family:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
        avatar_url:
          type: string
          nullable: true
    FamilyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        timezone:
          type: string
          default: Asia/Shanghai
        currency:
          type: string
          default: CNY
    FamilyUpdateRequest:
      type: object
      properties:
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
        avatar_url:
          type: string
    FamilyEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Family'
    Member:
      type: object
      properties:
        id:
          type: string
        family_id:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
    MemberListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Member'
    Cat:
      type: object
      properties:
        id:
          type: string
        family_id:
          type: string
        name:
          type: string
        breed:
          type: string
          nullable: true
        gender:
          type: string
          enum: [male, female, unknown]
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        birthday:
          type: string
          format: date
          nullable: true
          description: Legacy client compatibility alias of birth_date.
        neutered:
          type: boolean
        diseases:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        color:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
    CatCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        breed:
          type: string
        gender:
          type: string
          enum: [male, female, unknown]
        birth_date:
          type: string
          format: date
        neutered:
          type: boolean
        diseases:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        color:
          type: string
    CatUpdateRequest:
      type: object
      properties:
        name:
          type: string
        breed:
          type: string
        gender:
          type: string
          enum: [male, female, unknown]
        birth_date:
          type: string
          format: date
        neutered:
          type: boolean
        color:
          type: string
        avatar_key:
          type: string
    CatEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Cat'
    CatListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Cat'
    RecordInput:
      type: object
      required: [type, cat_ids]
      properties:
        type:
          type: string
          enum: [feeding, drinking, elimination, vomit, weight, medication, mental, symptom, visit, vaccine, deworm, food-change, behavior, interaction, photo, milestone, custom]
        cat_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        occurred_at: { type: string, format: date-time }
        severity: { type: string }
        title: { type: string, maxLength: 255 }
        note: { type: string }
        source: { type: string, maxLength: 20 }
        payload:
          type: object
          additionalProperties: true
    RecordUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/RecordInput'
        - type: object
          required: [expected_updated_at]
          properties:
            expected_updated_at:
              type: string
              format: date-time
              description: 记录详情中返回的 updated_at；不匹配时返回冲突
    Record:
      type: object
      required: [id, family_id, created_by, created_at, updated_at, cat_ids, type, occurred_at, source, severity, title, note]
      properties:
        id: { type: string }
        family_id: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cat_ids:
          type: array
          items: { type: string }
        type: { type: string }
        occurred_at: { type: string, format: date-time }
        source: { type: string }
        severity: { type: string }
        title: { type: string }
        note: { type: string }
        payload:
          type: object
          additionalProperties: true
    # --- Agent（猫管家）schemas ---
    AgentMessage:
      type: object
      required: [id, role, visibility, type, severity, title, body, generated_at, model]
      properties:
        id: { type: string }
        session_id: { type: string, description: 对话消息所属会话；巡检消息可空 }
        role:
          type: string
          enum: [user, assistant, tool]
        visibility:
          type: string
          enum: [family, private]
        family_id: { type: string }
        user_id: { type: string, description: 系统消息可空 }
        cat_id: { type: string, description: 单猫消息的明确归属 }
        type:
          type: string
          enum: [patrol_abnormal, patrol_weight, chat_answer, reminder_draft]
        severity:
          type: string
          enum: [info, warning, danger]
        title: { type: string, maxLength: 200 }
        body: { type: string }
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/AgentEvidence'
        action_suggestions:
          type: array
          items:
            $ref: '#/components/schemas/AgentAction'
        draft_version: { type: integer, minimum: 0 }
        draft_reminder:
          $ref: '#/components/schemas/AgentReminderInput'
        draft_expires_at: { type: string, format: date-time }
        action_status:
          type: string
          enum: [pending, confirmed, dismissed, expired]
        display_status:
          type: string
          enum: [dismissed]
          description: 忽略后从家庭消息列表隐藏；已确认提醒的 action_status 保持 confirmed
        generated_at: { type: string, format: date-time }
        model:
          type: string
          description: 规则引擎或实际 Provider 模型名；规则巡检为 rule-engine-v1
        disclaimer: { type: string }
        turn_id: { type: string }
        client_message_id: { type: string }
        run_status: { type: string, enum: [pending, running, completed, failed] }
        run_lease_until: { type: string, format: date-time }
        degraded: { type: boolean }
    AgentEvidence:
      type: object
      required: [source_type, source_id]
      description: |
        R-03/R-05 的 source_type=reminder 且 source_id 为提醒 ID；R-04
        引用最近称重记录 ID，若从未称重则以 cat_profile 引用猫咪建档 ID；R-06 使用
        family_scope 和家庭 ID，并在 excerpt 写明查询的本地日期范围。
      properties:
        source_type:
          type: string
          enum: [record, reminder, trend, weight, cat_profile, family_scope]
        source_id: { type: string, description: 记录/提醒 ID；趋势类可空 }
        cat_ids:
          type: array
          items: { type: string }
        occurred_at: { type: string, format: date-time }
        excerpt: { type: string, description: 原始文案节选，禁止改写诊断 }
    AgentAction:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [view_records, view_trend, create_reminder]
        title: { type: string }
        cat_id: { type: string, description: 单猫导航/提醒必填；家庭级留空 }
        days: { type: integer, minimum: 1, maximum: 90 }
        payload:
          type: object
          description: 仅导航类允许携带限定键
    AgentReminderInput:
      type: object
      required: [type, title]
      properties:
        cat_id: { type: string, description: 猫咪 ID 或 both；家庭级留空 }
        type:
          type: string
          enum: [medication, vaccine, deworm, checkup, weight, inventory, water, custom]
        title: { type: string, maxLength: 200 }
        subtitle: { type: string }
        time: { type: string, description: 展示用 time_label 兼容字段 }
        scheduled_at: { type: string, format: date-time, description: 可计算的绝对时间（UTC 存储） }
        timezone: { type: string, description: IANA 时区，展示用 }
        icon: { type: string }
        rule: { type: string }
    AgentReminderDraft:
      type: object
      required: [message_id, version, expires_at]
      properties:
        message_id: { type: string }
        version: { type: integer }
        expires_at: { type: string, format: date-time }
        reminder:
          $ref: '#/components/schemas/AgentReminderInput'
        confirmed_reminder_id: { type: string }
    AgentReminderResult:
      type: object
      required: [id, family_id, cat_id, type, title, state]
      properties:
        id: { type: string }
        family_id: { type: string }
        cat_id: { type: string }
        type: { type: string }
        title: { type: string }
        subtitle: { type: string }
        time: { type: string }
        state: { type: string }
        icon: { type: string }
        rule: { type: string }
        scheduled_at: { type: string, format: date-time }
        timezone: { type: string }
        completed_at: { type: string, format: date-time }
    AgentChatRequest:
      type: object
      required: [client_message_id, message]
      properties:
        session_id: { type: string, description: 首轮可缺省 }
        client_message_id: { type: string, minLength: 1, maxLength: 128, description: 幂等键，同会话内唯一 }
        message: { type: string, minLength: 1, maxLength: 2000 }
    AgentSessionSummary:
      type: object
      required: [id, created_at, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentReminderEditRequest:
      type: object
      required: [expected_version, reminder]
      properties:
        expected_version: { type: integer, minimum: 0 }
        reminder:
          $ref: '#/components/schemas/AgentReminderInput'
    AgentConfirmRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 0 }
    AgentPatrolRequest:
      type: object
      required: [family_id]
      properties:
        family_id: { type: string }
    AgentMessageListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [messages, next_cursor]
              properties:
                messages:
                  type: array
                  items:
                    $ref: '#/components/schemas/AgentMessage'
                next_cursor: { type: string }
    AgentMessageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AgentMessage'
    AgentReminderDraftEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AgentReminderDraft'
    AgentChatEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [session_id, turn_id, client_message_id, status, message, degraded]
              properties:
                session_id: { type: string }
                turn_id: { type: string }
                client_message_id: { type: string }
                status: { type: string, enum: [running, completed] }
                message:
                  nullable: true
                  allOf:
                    - $ref: '#/components/schemas/AgentMessage'
                degraded: { type: boolean }
    AgentConfirmEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [reminder, message_id, action_status]
              properties:
                reminder:
                  $ref: '#/components/schemas/AgentReminderResult'
                message_id: { type: string }
                action_status:
                  type: string
                  enum: [confirmed]
    AgentPatrolEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    $ref: '#/components/schemas/AgentMessage'
    AgentSessionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [sessions, next_cursor]
              properties:
                sessions:
                  type: array
                  items:
                    $ref: '#/components/schemas/AgentSessionSummary'
                next_cursor: { type: string }
    AgentSessionMessagesEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [messages, next_cursor]
              properties:
                messages:
                  type: array
                  items:
                    $ref: '#/components/schemas/AgentMessage'
                next_cursor: { type: string }
    # ---- 待购买清单 ----
    ShoppingItem:
      type: object
      required: [id, name, quantity, priority, status]
      properties:
        id: { type: string }
        name: { type: string }
        brand: { type: string }
        specification: { type: string }
        category: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit: { type: string }
        note: { type: string }
        priority: { type: string, enum: [low, normal, high] }
        status: { type: string, enum: [todo, purchased, dismissed] }
        matched_inventory_item_id: { type: string }
        completed_at: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    ShoppingInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        brand: { type: string, maxLength: 120 }
        specification: { type: string, maxLength: 120 }
        category: { type: string, maxLength: 64 }
        quantity: { type: integer, minimum: 1, default: 1 }
        unit: { type: string, maxLength: 32 }
        note: { type: string }
        priority: { type: string, enum: [low, normal, high], default: normal }
    ShoppingUpdateInput:
      type: object
      description: 未提供的字段保持原值；status 置为 purchased 即完成。
      properties:
        name: { type: string, minLength: 1 }
        brand: { type: string }
        specification: { type: string }
        category: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit: { type: string }
        note: { type: string }
        priority: { type: string, enum: [low, normal, high] }
        status: { type: string, enum: [todo, purchased, dismissed] }
        matched_inventory_item_id: { type: string }
    # ---- 库存调整与流水 ----
    InventoryItem:
      type: object
      required: [id, name, quantity, unit, status]
      properties:
        id: { type: string }
        name: { type: string }
        brand: { type: string }
        specification: { type: string }
        category: { type: string }
        quantity: { type: integer }
        unit: { type: string }
        estimatedDays: { type: integer }
        status: { type: string, enum: [ok, low, expired] }
        expiry: { type: string }
    InventoryAdjustRequest:
      type: object
      required: [delta]
      properties:
        delta: { type: integer, description: 正入库、负出库；不得为 0 }
        reason: { type: string, maxLength: 120, description: 缺省为 manual_adjustment }
    InventoryTransaction:
      type: object
      required: [id, item_id, change, reason]
      properties:
        id: { type: string }
        item_id: { type: string }
        change: { type: integer }
        reason: { type: string }
        source_type: { type: string, enum: [opening_balance, manual_adjustment, purchase_import] }
        source_id: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    InventoryAdjustment:
      type: object
      required: [item, transaction]
      properties:
        item:
          $ref: '#/components/schemas/InventoryItem'
        transaction:
          $ref: '#/components/schemas/InventoryTransaction'
    # ---- 采购导入 ----
    PurchaseLine:
      type: object
      required: [id, name, quantity, confidence]
      properties:
        id: { type: string }
        raw_title: { type: string }
        name: { type: string }
        specification: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit: { type: string }
        line_amount: { type: number, format: double, description: 元；未识别到时为 null }
        confidence: { type: string, enum: [high, medium, low, none] }
        evidence: { type: string }
        include_in_stock: { type: boolean }
        matched_inventory_item_id: { type: string }
        matched_shopping_item_id: { type: string }
    PurchaseImport:
      type: object
      required: [id, status, total_amount, currency, recognition_version]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [uploaded, processing, parsed, partial, failed, confirmed, cancelled]
        platform: { type: string, enum: [taobao, jd, pdd, other] }
        order_date: { type: string, description: YYYY-MM-DD }
        order_no: { type: string }
        total_amount: { type: number, format: double, description: 实付总额（元） }
        currency: { type: string, default: CNY }
        media_keys: { type: array, items: { type: string } }
        recognition_version: { type: integer }
        error_summary: { type: string }
        confirmed_at: { type: string, format: date-time }
        expense_id: { type: string }
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseLine'
        created_at: { type: string, format: date-time }
    PurchaseRecognizeResult:
      type: object
      required: [import, success]
      properties:
        import:
          $ref: '#/components/schemas/PurchaseImport'
        success: { type: boolean, description: false 表示识别失败但导入记录保留 }
        issues:
          type: array
          items: { type: string }
    PurchaseDraftLineInput:
      type: object
      required: [name]
      properties:
        id: { type: string, description: 沿用已有行 ID 可保持行标识稳定 }
        name: { type: string, minLength: 1 }
        specification: { type: string }
        quantity: { type: integer, minimum: 1, default: 1 }
        unit: { type: string }
        line_amount: { type: number, description: 元 }
        confidence: { type: string, enum: [high, medium, low, none] }
        evidence: { type: string }
        include_in_stock: { type: boolean, description: 是否在确认时入库 }
        matched_inventory_item_id: { type: string }
        matched_shopping_item_id: { type: string }
    PurchaseDraftRequest:
      type: object
      properties:
        expected_version: { type: integer, description: 与 recognition_version 不一致时 409 }
        platform: { type: string }
        order_date: { type: string }
        total_amount: { type: number }
        currency: { type: string }
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseDraftLineInput'
    PurchaseConfirmRequest:
      type: object
      properties:
        expected_version: { type: integer }
        include_expense: { type: boolean, default: true, description: false 时只更新库存与待购状态 }
    PurchaseConfirmSummary:
      type: object
      required: [import, created]
      properties:
        import:
          $ref: '#/components/schemas/PurchaseImport'
        created: { type: boolean, description: false 表示幂等重放，未重复落账 }
        expense_id: { type: string }
        expense_amount: { type: number }
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/InventoryTransaction'
        shopping_completed:
          type: array
          items: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
